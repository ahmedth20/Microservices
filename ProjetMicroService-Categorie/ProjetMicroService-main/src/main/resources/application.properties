spring.application.name=gestionA

# Activation de la console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2



# Configuration de la base de donn�es H2
spring.datasource.url=jdbc:h2:file:./Database/Data/ProjetMicro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=Slouma
spring.datasource.password=

# Configuration de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Port du serveur
server.port=9090

eureka.client.service-url.defaultZone=http://eurekaserver:8761/eureka

eureka.client.register-with-eureka=true
